<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}: {{ site.subtitle }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="canonical" href="{{ site.url }}/">
  <meta property="og:title" content="{{ site.title }}: {{ site.subtitle }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}/">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/images/btdstudio-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/stylesheets/site.css">
  <script src="/javascripts/site.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="wrap masthead-row">
      <a class="wordmark" href="/"><img class="seal" src="/images/btdstudio-mark.svg" alt="" width="26" height="26">btdstudio</a>
      <nav aria-label="Primary">
        <a href="#flow">How it works</a>
        <a href="#tools">Tools</a>
        <a href="https://github.com/btdstudio">GitHub</a>
      </nav>
    </div>
  </header>
  <main id="main">
{{ content }}
  </main>
  <footer class="colophon">
    <div class="wrap colophon-row">
      <span>Built with <a href="#hanga">hanga</a>.</span>
      <a href="https://github.com/btdstudio">github.com/btdstudio</a>
    </div>
  </footer>
</body>
</html>
